name: Release Skills

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semantic version and release tag
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import re
          import subprocess
          import sys

          plugin_files = glob.glob("config/plugins/*/plugin.json")
          if not plugin_files:
              print("::error::No plugin.json files found.")
              sys.exit(1)

          versions = set()
          for pf in plugin_files:
              with open(pf, "r", encoding="utf-8") as f:
                  data = json.load(f)
                  ver = data.get("version")
                  if not ver:
                      print(f"::error::Missing version in {pf}")
                      sys.exit(1)
                  versions.add(ver)

          if len(versions) > 1:
              print(f"::error::Plugins have mismatched versions: {versions}")
              sys.exit(1)

          version_str = versions.pop()
          semver_match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", version_str)
          if not semver_match:
              print(f"::error::Version '{version_str}' is not a valid semantic version (a.b.c)")
              sys.exit(1)

          curr = tuple(int(x) for x in semver_match.groups())
          target_tag = f"v{version_str}"
          print(f"Target release tag: {target_tag}")

          subprocess.run(["git", "fetch", "--tags", "--quiet"], check=False)

          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")

          if ref_type == "tag":
              if ref_name != target_tag:
                  print(f"::error::Pushed tag '{ref_name}' does not match plugin.json '{target_tag}'")
                  sys.exit(1)
              print(f"Tag matches plugin.json version: {ref_name}")
          else:
              tag_check = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{target_tag}"],
                  capture_output=True,
              )
              if tag_check.returncode == 0:
                  print(f"::error::Release tag '{target_tag}' already exists. Version must increment.")
                  sys.exit(1)

          tag_proc = subprocess.run(
              ["git", "tag", "-l", "v*"],
              capture_output=True,
              text=True,
              check=True,
          )
          prev_versions = []
          for tag in tag_proc.stdout.splitlines():
              m = re.match(r"^v(\d+)\.(\d+)\.(\d+)$", tag.strip())
              if m:
                  v = tuple(int(x) for x in m.groups())
                  if v != curr:
                      prev_versions.append(v)

          if prev_versions:
              prev_versions.sort()
              prev = prev_versions[-1]
              p_str = f"{prev[0]}.{prev[1]}.{prev[2]}"
              c_str = f"{curr[0]}.{curr[1]}.{curr[2]}"

              is_patch = (curr[0] == prev[0] and curr[1] == prev[1] and curr[2] == prev[2] + 1)
              is_minor = (curr[0] == prev[0] and curr[1] == prev[1] + 1 and curr[2] == 0)
              is_major = (curr[0] == prev[0] + 1 and curr[1] == 0 and curr[2] == 0)

              if not (is_patch or is_minor or is_major):
                  print(
                      f"::error::Invalid version increment from {p_str} to {c_str}. "
                      "Exactly one component (a, b, or c) must increment by one step."
                  )
                  sys.exit(1)
              print(f"Valid single-step increment from {p_str} to {c_str}")
          else:
              print(f"No previous semver tags found. Starting version: {version_str}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"RELEASE_TAG={target_tag}\n")
          EOF

      - name: Package skills
        run: |
          mkdir -p dist
          for skill_dir in config/plugins/*/skills/*/; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              echo "Packaging skill $skill_name..."
              (cd "$skill_dir" && \
                zip -r "$GITHUB_WORKSPACE/dist/${skill_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Package plugins
        run: |
          for plugin_dir in config/plugins/*/; do
            if [ -f "${plugin_dir}plugin.json" ]; then
              plugin_name=$(basename "$plugin_dir")
              echo "Packaging plugin $plugin_name..."
              (cd "$plugin_dir" && \
                zip -r "$GITHUB_WORKSPACE/dist/${plugin_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --title "Release $RELEASE_TAG" \
            --generate-notes
