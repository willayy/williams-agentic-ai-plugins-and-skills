name: Release Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semantic version and release tag
        run: |
          VERSIONS=$(jq -r '.version' config/plugins/*/plugin.json | sort -u)
          VERSION_COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')

          if [ -z "$VERSIONS" ]; then
            echo "::error::No version found in config/plugins/*/plugin.json"
            exit 1
          fi

          if [ "$VERSION_COUNT" -ne 1 ]; then
            echo "::error::Plugins have mismatched versions:"
            echo "$VERSIONS"
            exit 1
          fi

          TAG="v${VERSIONS}"
          echo "Target release tag: $TAG"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag '$TAG' already exists. The version in plugin.json must be incremented before releasing."
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Package skills
        run: |
          mkdir -p dist
          for skill_dir in config/plugins/*/skills/*/; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              echo "Packaging skill $skill_name..."
              (cd "$skill_dir" && zip -r "$GITHUB_WORKSPACE/dist/${skill_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Package plugins
        run: |
          for plugin_dir in config/plugins/*/; do
            if [ -f "${plugin_dir}plugin.json" ]; then
              plugin_name=$(basename "$plugin_dir")
              echo "Packaging plugin $plugin_name..."
              (cd "$plugin_dir" && zip -r "$GITHUB_WORKSPACE/dist/${plugin_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --title "Release $RELEASE_TAG" \
            --generate-notes
