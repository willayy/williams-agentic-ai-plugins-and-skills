name: Release Skills

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semantic version and release tag
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          plugin_files = list(Path("config/plugins").glob("*/plugin.json"))
          if not plugin_files:
              sys.exit("::error::No plugin.json files found.")

          versions = {
              json.loads(p.read_text(encoding="utf-8")).get("version")
              for p in plugin_files
          }
          if None in versions or "" in versions:
              sys.exit("::error::Missing version in one or more plugin.json files")
          if len(versions) != 1:
              sys.exit(f"::error::Plugins have mismatched versions: {versions}")

          version_str = next(iter(versions))
          if not (m := re.match(r"^(\d+)\.(\d+)\.(\d+)$", version_str)):
              sys.exit(f"::error::Version '{version_str}' is not valid semantic version (a.b.c)")

          curr = tuple(map(int, m.groups()))
          target_tag = f"v{version_str}"
          print(f"Target release tag: {target_tag}")

          subprocess.run(["git", "fetch", "--tags", "--quiet"], check=False)

          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")

          if ref_type == "tag":
              if ref_name != target_tag:
                  sys.exit(f"::error::Pushed tag '{ref_name}' != plugin.json '{target_tag}'")
              print(f"Tag matches plugin.json version: {ref_name}")
          elif subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{target_tag}"],
              capture_output=True,
          ).returncode == 0:
              sys.exit(f"::error::Release tag '{target_tag}' already exists. Increment version")

          tag_proc = subprocess.run(
              ["git", "tag", "-l", "v*"],
              capture_output=True,
              text=True,
              check=True,
          )
          tags = [
              tuple(map(int, tm.groups()))
              for t in tag_proc.stdout.splitlines()
              if (tm := re.match(r"^v(\d+)\.(\d+)\.(\d+)$", t.strip()))
          ]
          prev = sorted(v for v in tags if v != curr)

          if prev:
              p = prev[-1]
              if not (
                  curr == (p[0], p[1], p[2] + 1)
                  or curr == (p[0], p[1] + 1, 0)
                  or curr == (p[0] + 1, 0, 0)
              ):
                  p_str = f"{p[0]}.{p[1]}.{p[2]}"
                  sys.exit(
                      f"::error::Invalid version increment from {p_str} to {version_str}. "
                      "Exactly one component (a, b, or c) must increment by one step."
                  )
              print(f"Valid single-step increment from {p[0]}.{p[1]}.{p[2]} to {version_str}")
          else:
              print(f"No previous semver tags found. Starting version: {version_str}")

          if gh_env := os.environ.get("GITHUB_ENV"):
              with open(gh_env, "a", encoding="utf-8") as f:
                  f.write(f"RELEASE_TAG={target_tag}\n")
          EOF

      - name: Package skills
        run: |
          mkdir -p dist
          for skill_dir in config/plugins/*/skills/*/; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              echo "Packaging skill $skill_name..."
              (cd "$skill_dir" && \
                zip -r "$GITHUB_WORKSPACE/dist/${skill_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Package plugins
        run: |
          for plugin_dir in config/plugins/*/; do
            if [ -f "${plugin_dir}plugin.json" ]; then
              plugin_name=$(basename "$plugin_dir")
              echo "Packaging plugin $plugin_name..."
              (cd "$plugin_dir" && \
                zip -r "$GITHUB_WORKSPACE/dist/${plugin_name}.zip" . -x "*.DS_Store*")
            fi
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --title "Release $RELEASE_TAG" \
            --generate-notes
